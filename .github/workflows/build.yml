name: Build desktop bundles

# Builds the Tauri app for Windows / macOS / Linux on native runners.
#
# For each platform it uploads BOTH:
#   • the single-file executable (raw release binary — runs with no installer)
#   • the full bundle (installer / AppImage / dmg)
#
# Trigger manually from the Actions tab, or on a push to a `v*` tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            bin: pdf2word-macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            bin: pdf2word-windows-x64.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            bin: pdf2word-linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Build (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "PDF to Word v__VERSION__"
          args: --target ${{ matrix.target }}

      - name: Upload single-file executable to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BIN="src-tauri/target/${{ matrix.target }}/release/pdf2word-tauri${{ matrix.ext }}"
          gh release upload "v$VERSION" "$BIN" --clobber

      - name: Upload single-file executable + bundle
        uses: actions/upload-artifact@v4
        with:
          name: pdf2word-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/pdf2word-tauri${{ matrix.ext }}
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
