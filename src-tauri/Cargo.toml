[package]
name = "pdf2word-tauri"
version = "0.1.0"
description = "PDF to Word converter — small Tauri desktop app"
edition = "2021"

[lib]
name = "pdf2word_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.44.0"
pdf-extract = "0.12.0"
docx-rs = "0.4.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
flate2 = "1.1.10"
